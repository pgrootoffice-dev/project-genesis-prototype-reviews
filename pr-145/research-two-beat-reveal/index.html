<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>夜の森で、次に必要なものは？ — FARLENS Research Prototype</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<main id="app" data-screen="setup">

  <section id="screen-setup" class="screen" aria-hidden="false">
    <p class="lead">夜の森で、静かな物音がする。</p>

    <div class="clues" role="group" aria-label="森の手がかり">
      <div class="clue" data-clue="footprints">
        <svg class="clue-art" viewBox="0 0 100 100" aria-hidden="true">
          <ellipse cx="38" cy="62" rx="10" ry="14" />
          <ellipse cx="60" cy="42" rx="10" ry="14" />
          <ellipse cx="78" cy="24" rx="9" ry="12" />
        </svg>
        <span class="visually-hidden">小さな足あと</span>
      </div>

      <div class="clue" data-clue="grass">
        <svg class="clue-art" viewBox="0 0 100 100" aria-hidden="true">
          <g class="grass-blade grass-blade-1">
            <rect x="30" y="30" width="10" height="60" rx="5" />
          </g>
          <g class="grass-blade grass-blade-2">
            <rect x="46" y="20" width="10" height="70" rx="5" />
          </g>
          <g class="grass-blade grass-blade-3">
            <rect x="62" y="34" width="10" height="56" rx="5" />
          </g>
        </svg>
        <span class="visually-hidden">揺れている草</span>
      </div>

      <div class="clue" data-clue="light">
        <svg class="clue-art" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="glow" cx="50" cy="50" r="34" />
          <circle class="glow-core" cx="50" cy="50" r="12" />
        </svg>
        <span class="visually-hidden">遠くの弱い光</span>
      </div>
    </div>

    <p class="prompt">どうする？</p>

    <div class="choices" role="group" aria-label="次の行動を選ぶ">
      <button type="button" class="choice" data-choice="listen">音をよく聞く</button>
      <button type="button" class="choice" data-choice="climb">高い場所へ登る</button>
      <button type="button" class="choice" data-choice="follow">光を追いかける</button>
    </div>
  </section>

  <section id="screen-reveal" class="screen" aria-hidden="true">
    <div class="reveal-art">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="reveal-glow" cx="50" cy="50" r="40" />
      </svg>
    </div>
    <p id="reveal-clue-name" class="reveal-clue-name"></p>
    <p id="reveal-text" class="reveal-text"></p>
    <button type="button" id="retry" class="retry">もう一度試す</button>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
