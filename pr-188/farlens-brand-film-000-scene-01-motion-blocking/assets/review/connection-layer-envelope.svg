<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title description">
  <title id="title">Scene 1 to Scene 2 connection layer envelopes</title>
  <description id="description">Review-only 1.1 second transition showing the ordered arrival of warm center melt, air and horizon, terrain, lower-left masses, and information membranes.</description>
  <rect width="1280" height="620" fill="#061329"/>
  <text x="64" y="62" fill="#f5dca8" font-family="system-ui, sans-serif" font-size="30" font-weight="700">Scene 1 → 2｜Layer Envelope Evidence</text>
  <text x="64" y="98" fill="#9cb7ce" font-family="system-ui, sans-serif" font-size="18">Review 10.0–11.1s · 1.1s · full-screen uniform crossfade: 0</text>
  <line x1="370" y1="142" x2="1180" y2="142" stroke="#36506b" stroke-width="2"/>
  <g fill="#9cb7ce" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">
    <text x="370" y="132">10.0</text><text x="517" y="132">10.2</text><text x="665" y="132">10.4</text><text x="812" y="132">10.6</text><text x="959" y="132">10.8</text><text x="1106" y="132">11.0</text><text x="1180" y="132">11.1</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="18">
    <text x="64" y="194" fill="#f2c879">1  Warm center → atmosphere</text>
    <rect x="407" y="170" width="184" height="34" rx="17" fill="#d99a45" opacity="0.86"/>
    <text x="64" y="274" fill="#b6c9d9">2  Dark air / horizon</text>
    <rect x="532" y="250" width="206" height="34" rx="17" fill="#557b9b" opacity="0.9"/>
    <text x="64" y="354" fill="#9fc0b8">3  Terrain</text>
    <rect x="679" y="330" width="170" height="34" rx="17" fill="#5d927f" opacity="0.92"/>
    <text x="64" y="434" fill="#c5b697">4  Lower-left masses</text>
    <rect x="812" y="410" width="88" height="34" rx="17" fill="#9b865f" opacity="0.94"/>
    <text x="64" y="514" fill="#b7b7db">5  Information membranes</text>
    <rect x="930" y="490" width="73" height="34" rx="17" fill="#7777a5" opacity="0.96"/>
    <rect x="1033" y="490" width="147" height="34" rx="17" fill="none" stroke="#7777a5" stroke-width="2" opacity="0.8"/>
    <text x="1044" y="547" fill="#8f9eb4" font-size="14">direct Scene 2 settle</text>
  </g>
  <g stroke="#36506b" stroke-width="1" opacity="0.7">
    <line x1="370" y1="150" x2="370" y2="550"/><line x1="517" y1="150" x2="517" y2="550"/><line x1="665" y1="150" x2="665" y2="550"/><line x1="812" y1="150" x2="812" y2="550"/><line x1="959" y1="150" x2="959" y2="550"/><line x1="1106" y1="150" x2="1106" y2="550"/><line x1="1180" y1="150" x2="1180" y2="550"/>
  </g>
  <text x="64" y="585" fill="#7895ac" font-family="system-ui, sans-serif" font-size="16">Scene 1 Master and Scene 2 Master remain immutable. These envelopes exist only in the 0–23s review assembly.</text>
</svg>
