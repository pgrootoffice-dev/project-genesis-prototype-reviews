<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#030b0d" />
    <meta
      name="description"
      content="8歳が10秒で場所を理解し、30秒で自分から選びたくなる、沈んだ海底観測都市への没入プロトタイプ。"
    />
    <title>Prototype 01 - 沈んだ海底観測都市</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="stage">
      <section class="stage__page">
        <div class="city" data-city role="group" aria-label="沈んだ海底観測都市の入口">
          <h1 class="sr-only">
            静かな海の底、灯りが目覚めはじめる観測都市の入口。窓の外には深い海が広がり、足元には三つの行き先がある。
          </h1>

          <div class="city__deep" aria-hidden="true"></div>
          <div class="city__first-light" aria-hidden="true"></div>

          <div class="city__scene">
            <div class="city__window" aria-hidden="true">
              <div class="city__water"></div>
              <div class="city__particles">
                <span></span><span></span><span></span><span></span><span></span><span></span
                ><span></span><span></span>
              </div>
              <div class="city__creature city__creature--a"></div>
              <div class="city__creature city__creature--b"></div>
              <div class="city__frame-glow"></div>
            </div>

            <div class="city__floor-lights" aria-hidden="true">
              <span></span><span></span><span></span><span></span><span></span><span></span>
            </div>

            <p class="city__prompt" data-prompt>どこを見にいく？</p>

            <div class="city__doorways">
              <button
                class="city__spot city__spot--water"
                type="button"
                data-choice="water"
                aria-label="水がゆれる場所を見にいく"
              >
                <span class="city__glyph city__glyph--water" aria-hidden="true"></span>
              </button>
              <button
                class="city__spot city__spot--dark"
                type="button"
                data-choice="dark"
                aria-label="真っ暗な場所を見にいく"
              >
                <span class="city__glyph city__glyph--dark" aria-hidden="true"></span>
              </button>
              <button
                class="city__spot city__spot--light"
                type="button"
                data-choice="light"
                aria-label="遠くで光る場所を見にいく"
              >
                <span class="city__glyph city__glyph--light" aria-hidden="true"></span>
              </button>
            </div>
          </div>

          <p class="city__discovery" data-discovery aria-live="polite"></p>

          <div class="city__grain" aria-hidden="true"></div>
        </div>
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
