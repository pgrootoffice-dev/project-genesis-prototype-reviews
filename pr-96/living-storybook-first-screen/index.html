<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16201f" />
    <meta
      name="description"
      content="静かな光と奥行きが、触れた場所にだけ応える Living Storybook Prototype 1。"
    />
    <title>Living Storybook Prototype 1</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="storybook" aria-labelledby="page-title">
      <section class="storybook__page">
        <div
          class="world"
          data-living-world
          aria-label="水辺の小道の先に、静かな灯りが見える冒険絵本の入口"
        >
          <div class="world__painting" aria-hidden="true">
            <div class="world__layer world__layer--sky" aria-hidden="true"></div>
            <div class="world__layer world__layer--moon" aria-hidden="true"></div>
            <div class="world__layer world__layer--distant" aria-hidden="true"></div>
            <div class="world__layer world__layer--threshold" aria-hidden="true">
              <span class="threshold__arch"></span>
              <span class="threshold__light"></span>
              <span class="threshold__path"></span>
            </div>
            <div class="world__layer world__layer--water" aria-hidden="true"></div>
            <div class="world__layer world__layer--mist" aria-hidden="true"></div>
            <div class="world__layer world__layer--lanterns" aria-hidden="true">
              <span></span><span></span><span></span><span></span>
            </div>
            <div class="world__layer world__layer--foreground" aria-hidden="true"></div>
            <div class="world__response" data-world-response aria-hidden="true"></div>
            <div class="world__layer world__layer--grain" aria-hidden="true"></div>
          </div>

          <div class="world__copy">
            <p class="eyebrow">最初のページ</p>
            <h1 id="page-title">灯りの<br />向こうへ</h1>
            <p class="lead" id="world-invitation">まだ知らない問いが、静かに待っている。</p>
          </div>

          <button
            class="world__touch-surface"
            type="button"
            data-world-touch
            aria-label="世界にそっと触れる"
            aria-describedby="world-invitation"
          >
            <span class="sr-only">世界にそっと触れる</span>
          </button>
        </div>
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
