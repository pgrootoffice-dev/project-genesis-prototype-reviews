<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1717" />
    <meta
      name="description"
      content="触れても、世界が自分のリズムを選ぶ Living Storybook Prototype 4。"
    />
    <title>Living Storybook Prototype 4</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="storybook" aria-labelledby="page-title">
      <section class="storybook__page">
        <div
          class="world"
          data-living-world
          aria-label="水辺の石の小道が、灯りのともる静かな図書観測所へ続く冒険絵本の入口"
        >
          <div class="world__painting" aria-hidden="true">
            <img
              class="world__art"
              src="./assets/world-threshold-v2.png"
              alt=""
              draggable="false"
            />
            <div class="world__shade"></div>
            <div class="world__layer world__layer--water"></div>
            <div class="world__layer world__layer--mist world__layer--mist-far"></div>
            <div class="world__layer world__layer--mist world__layer--mist-near"></div>
            <div class="world__layer world__layer--light-field">
              <span></span><span></span><span></span><span></span><span></span>
            </div>
            <div class="world__threshold-signal"></div>
            <div class="world__reply" data-world-reply></div>
            <div class="world__response" data-world-response></div>
            <div class="world__grain"></div>
          </div>

          <div class="world__copy">
            <p class="eyebrow">第四のページ</p>
            <h1 id="page-title">灯りの先に、<br />世界がひらく。</h1>
            <p class="lead" id="world-invitation">まだ知らない問いのある場所へ。</p>
          </div>

          <button
            class="world__touch-surface"
            type="button"
            data-world-touch
            aria-label="世界にそっと触れる"
            aria-describedby="world-invitation"
          >
            <span class="sr-only">世界にそっと触れる</span>
          </button>
        </div>
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
