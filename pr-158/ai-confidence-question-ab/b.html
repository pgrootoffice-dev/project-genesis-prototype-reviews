<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FARLENS Prototype B — Quiz-led Short</title>
<link rel="stylesheet" href="shared.css" />
</head>
<body>
<div class="stage-wrap">
  <div class="phone-frame" id="player-root">
    <div class="stage">

      <!-- Identical opening to A (same markup, same timing) -- this is the
           shared "開始条件" both variants keep fixed. -->
      <section class="scene" data-id="b1-declare" data-start="0" data-end="2.5" data-tone="440,120">
        <div class="ai-core"><span class="ai-mark">AI</span></div>
        <div class="speech-bubble">これは100％正しいです。</div>
      </section>

      <section class="scene" data-id="b2-prompt" data-start="2.5" data-end="4.5" data-tone="330,100">
        <p class="caption">どうする？</p>
      </section>

      <!-- Choice -> 判断の間 -> Reveal, all as one continuous scene so the
           two pills never disappear and reappear -- only their own
           border/glow state changes, driven by data-reveal-at (JS-toggled
           class, not a CSS animation-delay -- see scene-engine.js and
           shared.css for why that distinction matters here). -->
      <section class="scene" data-id="b3-choice" data-start="4.5" data-end="9.5">
        <div class="choice-row">
          <div class="choice-pill" style="transition-delay:.1s">すぐ信じる</div>
          <div class="choice-pill" style="transition-delay:.6s" data-reveal-at="7.8">根拠を確かめる</div>
        </div>
      </section>

      <section class="scene" data-id="b4-reveal-line" data-start="9.5" data-end="13" data-tone="523,180">
        <div class="evidence-card" aria-hidden="true">
          <svg viewBox="0 0 100 100">
            <path class="check-path" d="M22 52 L42 72 L80 28" />
          </svg>
        </div>
        <p class="caption">自信と正しさは、<br />同じとは限らない。</p>
      </section>

    </div>
    <div class="progress-track"><div class="progress-fill"></div></div>
  </div>

  <div class="controls">
    <button class="control-btn" data-action="play">▶ 再生する</button>
    <button class="control-btn secondary" data-action="mute">🔇 音: オフ</button>
  </div>
  <p class="label-row">B — Quiz-led Short（問い・選択・間・Reveal・約13秒・得点演出なし）</p>
</div>

<script src="scene-engine.js"></script>
<script>
  var player = new window.FarlensShortPlayer(document.getElementById("player-root"));
  player.restart();
</script>
</body>
</html>
