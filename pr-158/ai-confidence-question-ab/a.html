<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FARLENS Prototype A — Question-led Short</title>
<link rel="stylesheet" href="shared.css" />
</head>
<body>
<div class="stage-wrap">
  <div class="phone-frame" id="player-root">
    <div class="stage">

      <!-- Identical opening to B (same markup, same timing) -- this is the
           shared "開始条件" both variants keep fixed. -->
      <section class="scene" data-id="a1-declare" data-start="0" data-end="2.5" data-tone="440,120">
        <div class="ai-core"><span class="ai-mark">AI</span></div>
        <div class="speech-bubble">これは100％正しいです。</div>
      </section>

      <section class="scene" data-id="a2-question" data-start="2.5" data-end="6" data-tone="330,100">
        <p class="caption">自信があることと、<br />正しいことは同じ？</p>
      </section>

      <!-- 短い思考の間: no new text, the AI core alone, quiet. Deliberately
           does not add information -- this scene's whole point is the
           absence of a new concept, not a new one arriving. -->
      <section class="scene" data-id="a3-pause" data-start="6" data-end="8">
        <div class="ai-core"><span class="ai-mark">AI</span></div>
      </section>

      <section class="scene" data-id="a4-prompt" data-start="8" data-end="11.5" data-tone="392,140">
        <p class="caption">君なら、<br />どう確かめる？</p>
      </section>

      <!-- 余韻を残して終了: no resolving statement, no explanation-style
           conclusion, no choices -- only the child silhouette held quietly,
           inviting the viewer to keep thinking after the video ends. -->
      <section class="scene" data-id="a5-linger" data-start="11.5" data-end="13.7">
        <div class="child-figure" aria-hidden="true">
          <div class="head"></div>
          <div class="body"></div>
        </div>
      </section>

    </div>
    <div class="progress-track"><div class="progress-fill"></div></div>
  </div>

  <div class="controls">
    <button class="control-btn" data-action="play">▶ 再生する</button>
    <button class="control-btn secondary" data-action="mute">🔇 音: オフ</button>
  </div>
  <p class="label-row">A — Question-led Short（問いと余韻・約13.7秒・選択肢も結論も示さない）</p>
</div>

<script src="scene-engine.js"></script>
<script>
  var player = new window.FarlensShortPlayer(document.getElementById("player-root"));
  player.restart();
</script>
</body>
</html>
